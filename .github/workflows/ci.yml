name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The browser-free quick gates and the inventory check, on GitHub's hosted
# Linux runners. The full gate list and the Chromium picture job run in
# .forgejo/workflows/ci.yml.
jobs:
  verify:
    # One run, on the newest Python. The oldest supported (3.11, as
    # requires-python says) is still checked statically: ruff and mypy
    # target it.
    name: Verify (Python 3.15)
    # Pinned: Playwright 1.55 (pinned in the test extra) installs no Chromium
    # on Ubuntu 26.04, which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        env:
          # Artwork is hashed byte for byte: check files out exactly as committed.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - run: python -m pip install -e "./plugin[test]"

      # The 3D items in the unit suite are drawn in Chromium: the build the
      # pinned Playwright expects, with its system libraries. Those come from
      # Ubuntu's mirror, which runners sometimes cannot resolve (apt then
      # retries for ten minutes and the job fails before a test runs); the
      # runner image carries the libraries its own Chrome needs, so a
      # mirror that does not answer within five minutes is a warning.
      - name: Chromium's system libraries
        run: >-
          timeout 300 python -m playwright install-deps chromium
          || echo "::warning::Ubuntu's mirror did not answer; Chromium runs on the libraries the runner image carries"
      - run: python -m playwright install chromium

      # Lint, format, types, line endings, naming, docs, plugin package,
      # then the unit and skill suites without the slow sweeps.
      - run: python -m infragram verify:quick

      - run: python -m infragram verify:inventory
