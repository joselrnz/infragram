name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The browser-free quick gates and the inventory check, on GitHub's hosted
# Linux runners. The full gate list and the Chromium picture job run in
# .forgejo/workflows/ci.yml.
jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        env:
          # Artwork is hashed byte for byte: check files out exactly as committed.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -e "./plugin[test]"

      # The 3D items in the unit suite are drawn in Chromium: the build the
      # pinned Playwright expects, with its system libraries.
      - run: python -m playwright install --with-deps chromium

      # Lint, format, types, line endings, naming, docs, plugin package,
      # then the unit and skill suites without the slow sweeps.
      - run: python -m infragram verify:quick

      - run: python -m infragram verify:inventory
