# The dependency audit, on a schedule as well as on every push.
#
# An advisory published against a package uv.lock pins turns the audit red
# with no change in this tree, so waiting for the next push could hide it for
# weeks. This job runs the same gate CI's `gates` job ends with
# (scripts/verify/audit.py) every Monday, and on demand from the Actions tab.

name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  audit:
    name: Pinned packages against the advisories
    runs-on: docker
    # actions/checkout is a Node action: the image CI uses carries Node, and
    # Python comes from apt, as in ci.yml.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 python3-pip python-is-python3 > /dev/null
          python --version

      - name: Install pip-audit
        run: python -m pip install --break-system-packages "pip-audit>=2.10,<3"

      - name: Dependency audit
        run: python scripts/verify/audit.py
